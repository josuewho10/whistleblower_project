{% extends 'denuncias/base.html' %}

{% block title %}Dashboard | Whistleblower{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-speedometer2"></i> Panel de Usuario</h4>
            </div>
            <div class="card-body text-center p-5">
                <i class="bi bi-person-circle text-primary" style="font-size: 4rem;"></i>
                <h3 class="mt-3">Bienvenido, {{ user.username|capfirst }}!</h3>
                <p class="text-muted">Has iniciado sesion de forma segura.</p>
                
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="{% url 'registrar_denuncia' %}" class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Nueva Denuncia
                    </a>
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger">
                            <i class="bi bi-box-arrow-right"></i> Cerrar Sesion
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
